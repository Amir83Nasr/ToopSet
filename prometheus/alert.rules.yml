groups:
  - name: toopset-backend
    interval: 30s
    rules:

      # ── Error rate spike ────────────────────────────────────────────────────
      - alert: HighErrorRate5xx
        expr: |
          (sum(rate(http_errors_total{status=~"5.."}[5m]))
           /
           sum(rate(http_requests_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          title: "⚠️  نرخ خطای بالا – High 5xx Error Rate"
          description: |
            خطاهای 5xx به {{ $value | humanizePercentage }} از کل درخواست‌ها
            رسیده است (آستانه: ۵٪).

      - alert: Elevated4xxRate
        expr: |
          (sum(rate(http_errors_total{status=~"4.."}[5m]))
           /
           sum(rate(http_requests_total[5m]))) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "⚠️  افزایش خطاهای 4xx"
          description: |
            خطاهای 4xx به {{ $value | humanizePercentage }} رسیده است (آستانه: ۱۰٪).

      # ── Latency degradation ─────────────────────────────────────────────────
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          title: "🐢  تأخیر بالای API"
          description: |
            p95 latency به {{ $value | humanizeDuration }} رسیده است (آستانه: ۲s).

      # ── Service down ────────────────────────────────────────────────────────
      - alert: BackendDown
        expr: up{job="toopset-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          title: "🔥  سرور بک‌اند در دسترس نیست"
          description: |
            سرویس toopset-backend برای بیش از ۱ دقیقه پاسخ نمی‌دهد.

      - alert: PostgresDown
        expr: up{job="toopset-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          title: "🗄️  پایگاه داده PostgreSQL در دسترس نیست"
          description: |
            PostgreSQL exporter برای بیش از ۱ دقیقه پاسخ نمی‌دهد.

      - alert: RedisDown
        expr: up{job="toopset-redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          title: "📦  Redis در دسترس نیست"
          description: |
            Redis exporter برای بیش از ۱ دقیقه پاسخ نمی‌دهد.

      # ── Business metrics ────────────────────────────────────────────────────
      - alert: NoRecentBookings
        expr: toopset_today_bookings_total == 0
        for: 6h
        labels:
          severity: info
        annotations:
          title: "📭  بدون رزرو در ۶ ساعت گذشته"
          description: |
            از ۶ ساعت پیش هیچ رزروی ثبت نشده است.

      # ── Cache health ────────────────────────────────────────────────────────
      - alert: LowCacheHitRatio
        expr: |
          toopset_cache_hits_total
          /
          (toopset_cache_hits_total + toopset_cache_misses_total) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          title: "💾  نسبت Cache Hit پایین"
          description: |
            نسبت hit کش به {{ $value | humanizePercentage }} کاهش یافته است
            (آستانه: ۵۰٪). احتمالاً Redis در دسترس نیست.
