[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toopset-backend"
dynamic = ["version"]
description = "ToopSet — sports court booking platform backend"
requires-python = ">=3.12"
# Runtime dependencies are the source of truth in requirements.txt. Keep both
# in sync so `uv pip install -e .` (FastAPI Cloud build) and `pip install -r
# requirements.txt` install identical packages. Dev tooling (ruff/mypy/pytest)
# is deliberately NOT listed here — it is not needed at runtime.
dependencies = [
  "fastapi[standard]>=0.138.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "starlette>=1.3.1",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "slowapi>=0.1.9",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "python-json-logger>=2.0.7",
  "jdatetime>=5.0.0",
  "sentry-sdk>=2.0.0",
  "aioboto3>=13.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

# Package discovery must be explicit: this repo is a flat layout containing
# `app` (the package), plus non-package dirs `uploads/` and `migrations/`
# (no __init__.py). Without an explicit include, setuptools auto-discovery
# sees `['app', 'uploads', 'migrations']` and aborts the build with
# `PackageDiscoveryError: Multiple top-level packages` (exactly what FastAPI
# Cloud hit). Restricting discovery to `app.*` makes the project buildable.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pytest-httpx>=0.30",
  "asgi-lifespan>=2.0",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# docs/*.md embed python snippets as illustration, not formattable code.
# Excluded so no ruff version ever reformats them (CI runs `ruff format --check .`).
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/core/metrics.py" = ["F401"]
"scripts/seed.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
no_implicit_optional = true
no_implicit_reexport = true

# ── Pre-existing issues (use `from __future__ import annotations` + SQLAlchemy generics) ──
[[tool.mypy.overrides]]
module = [
  "app.models.*",
  "app.repositories.*",
  "app.schemas.*",
  "app.services.*",
  "app.core.security",
  "app.core.database",
  "app.api.*",
  "scripts.*",
  "migrations.*",
  "app.main",
]
ignore_errors = true
