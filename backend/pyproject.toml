[project]
name = "toopset-backend"
version = "0.2.0"
description = "ToopSet — sports court booking platform backend"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-httpx>=0.30",
    "asgi-lifespan>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/core/metrics.py" = ["F401"]
"scripts/seed.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
no_implicit_optional = true
no_implicit_reexport = true

# ── Pre-existing issues (use `from __future__ import annotations` + SQLAlchemy generics) ──
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.repositories.*",
    "app.schemas.*",
    "app.services.*",
    "app.core.security",
    "app.core.database",
    "app.api.*",
    "scripts.*",
    "migrations.*",
    "app.main",
]
ignore_errors = true


