# ── ToopSet — Dependency updates ──────────────────────────────────────────────
# Weekly scan for npm (frontend), pip (backend) and GitHub Actions.
# Dependabot groups related bumps into a single PR per group (2026 default)
# so CI runs once per grouped update instead of once per package.
# ──────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # ── Frontend (npm / pnpm) ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  # ── Backend (pip) ─────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
