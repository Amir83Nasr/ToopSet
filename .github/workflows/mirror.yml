name: Mirror to HamGit

on:
  push:
    branches: ["*"]
    tags:
      - "*"

jobs:
  to_hamgit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HamGit
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add hamgit "https://oauth2:${GITLAB_TOKEN}@hamgit.ir/imankarbalaei82/toopset.git"
          git push --mirror hamgit
