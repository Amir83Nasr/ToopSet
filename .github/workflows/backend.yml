# ────────────────────────────────────────────────────────────
# ToopSet — Backend CI/CD
# Triggered on pushes and PRs targeting main that touch
# backend files, the workflow itself, or the Makefile.
# ────────────────────────────────────────────────────────────

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"
      - "VERSION"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# ── Lint & Format ──────────────────────────────────────────
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

  # ── Security Scanning ─────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit security scan
        run: |
          bandit -r app/ -c pyproject.toml || echo "Bandit found issues (non-fatal)"

      - name: pip-audit dependency scan
        run: |
          pip-audit --ignore-dev --requirement requirements.txt || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: backend/
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  # ── Tests ─────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'toopset_secret' }}
          POSTGRES_DB: toopset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run Alembic migrations (up)
        run: alembic upgrade head
        env:
          POSTGRES_DB: toopset_test

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -W ignore::DeprecationWarning \
            --cov=app \
            --cov-report=term \
            --cov-report=xml
        env:
          POSTGRES_DB: toopset_test

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Alembic downgrade validation ─────────────────────────
  migration-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: toopset_secret
          POSTGRES_DB: toopset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate up to latest
        run: alembic upgrade head
        env:
          POSTGRES_DB: toopset_test

      - name: Migrate down and back up
        run: |
          echo "=== Current version ==="
          alembic current
          echo "=== Downgrading by 1 ==="
          alembic downgrade -1 || echo "Already at base, skipping downgrade"
          echo "=== Re-applying ==="
          alembic upgrade head
          echo "=== Validated ==="

  # ── Coverage Gate ─────────────────────────────────────────
  coverage-gate:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Check coverage threshold
        run: |
          pip install lxml -q
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          covered = int(root.attrib.get('lines-covered', 0))
          valid = int(root.attrib.get('lines-valid', 0))
          pct = line_rate * 100
          threshold = 61.0
          print(f'Coverage: {pct:.2f}% ({covered}/{valid} lines)')
          if pct < threshold:
              print(f'FAIL: Coverage {pct:.2f}% is below threshold {threshold:.2f}%')
              exit(1)
          print(f'PASS: Coverage {pct:.2f}% meets threshold {threshold:.2f}%')
          "

  # ── Docker Build check (cached) ──────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: toopset-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
