# ── ToopSet — CI Gate ─────────────────────────────────────────────────────────
# Single status check that ALWAYS reports a conclusion for PRs to main and
# pushes to main. Branch protection requires exactly one check: "CI Gate / ci-gate".
# Job-name is fixed and stable (ci-gate) because the backfill for past runs
# (legacy-safe job-name matching) keys off it — renaming would break backfills.
#
# The gate mirrors backend-ci/frontend-ci exactly (same gating, same work). It
# could have listened to those workflows' job statuses, but that would make the
# gate depend on runner re-runs of skipped jobs and on which workflow touched
# files — both noise. Duplication is bounded and per-side cheap:
#   1 checkout + paths-filter job + (backend: pip setup + ruff/mypy/revisions,
#   or frontend: pnpm setup + eslint/typecheck) + the final gate status.
#
# Change-detection is deliberately DEFENSIVE — the same paths lists, gated the
# same way, as the two component workflows. If a repo layout change makes a
# check here and a check there diverge, the gate is wrong — but GitHub will
# report a FAILED gate (a passing component job cannot green a failing gate),
# so the safety failure mode is fail-closed, never false-green.
# ──────────────────────────────────────────────────────────────────────────────

name: CI Gate

# IMPORTANT: Do NOT add `paths:` to the `on:` triggers. This workflow must run
# for every PR to main so its required check always reports a conclusion.
# Path-gating must happen at the JOB level, otherwise a path-filtered run is
# skipped entirely and the required "CI Gate" check permanently shows
# "Expected — waiting for status to be reported".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel redundant runs for the same PR/ref (new commits kill in-progress runs).
concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: ./

jobs:
  # ── Final CI Gate (always runs) ──────────────────────────────────────────────
  # Backfill: checks that previously reported under the OLD job names are
  # backfilled onto this new stable context, so the gate never blocks on a
  # stale "Expected" status from a pre-migration run. The paths-filter list is
  # shared per-side with the component workflows; a skipped step reports as
  # "successful" and never blocks a PR.
  ci-gate:
    name: Verify required CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Mirrors the component workflows. Default excludes .github/**, so
          # workflow-only PRs (like this CI refactor) skip both sides and the
          # gate still reports a clean "CI Gate / ci-gate".
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      # ── Backend side ─────────────────────────────────────────────────────────
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version check
        if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true'
        run: make version-check

      - name: Lint (Ruff)
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: ruff format --check . && ruff check .

      - name: Typecheck (mypy)
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: mypy app

      - name: Migration revision check (no DB)
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: python3 -m scripts.check_revisions --strict

      # ── Frontend side ────────────────────────────────────────────────────────
      - name: Install pnpm
        if: steps.filter.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          # Monorepo: packageManager pin lives in frontend/package.json,
          # not the repo root (default lookup), so point the action at it.
          package_json_file: frontend/package.json

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck (TypeScript)
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm typecheck
