# ── ToopSet — Continuous Integration ──────────────────────────────────────────
# Final safety layer after local pre-commit + pre-push hooks.
# Runs on every PR and push to main + develop.
# Both frontend and backend jobs run in parallel for fast feedback.
# On failure: the failing step exits with non-zero and the job stops immediately
# (default GitHub behavior: fail-fast). No subsequent steps execute.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main, develop]

# Cancel redundant runs for the same PR (new commits kill in-progress runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Build (Next.js)
        run: pnpm build

  backend:
    name: Backend (lint + migration + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: toopset_test
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: toopset_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Static migration revision check (no DB)
        run: python3 -m scripts.check_revisions --strict

      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          POSTGRES_DB: toopset_test
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: toopset_secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://toopset:toopset_secret@localhost:5432/toopset_test

      - name: Test (pytest)
        run: python3 -m pytest tests/ -v --tb=short -W ignore::DeprecationWarning
        env:
          POSTGRES_DB: toopset_test
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: toopset_secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://toopset:toopset_secret@localhost:5432/toopset_test
