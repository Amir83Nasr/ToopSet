# ── ToopSet — Continuous Integration ──────────────────────────────────────────
# Orchestrator for the CI pipeline. Detects which subprojects changed and calls
# the matching reusable workflow (frontend/backend) only for what moved, so a
# backend-only PR never burns frontend build minutes and vice versa.
#
# version-check runs on every change before any build: the VERSION file must
# stay in sync with backend/app/__init__.py and frontend/package.json.
#
# Structure:
#   .github/workflows/ci.yml            <- this caller
#   .github/workflows/reusable/frontend.yml
#   .github/workflows/reusable/backend.yml
#
# Reusables live in workflows/reusable/ so they don't show up as top-level
# workflows. On failure the failing job exits non-zero and the run is marked
# failed; concurrency cancels redundant runs for the same ref.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main, develop]

# Cancel redundant runs for the same PR (new commits kill in-progress runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Path detection ───────────────────────────────────────────────────────────
  # Maps each subproject to a boolean output. Needs full history (fetch-depth: 0)
  # so the diff works for both push and pull_request events.
  changes:
    name: Detect changed subprojects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Compare against the merge base / target branch for PRs.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable/frontend.yml'
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable/backend.yml'

  # ── Version gate (always runs) ───────────────────────────────────────────────
  version-check:
    name: Version consistency check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version check
        run: make version-check

  # ── Subproject CI (path-gated) ───────────────────────────────────────────────
  frontend:
    name: Frontend CI
    needs: [changes, version-check]
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable/frontend.yml
    secrets: inherit

  backend:
    name: Backend CI
    needs: [changes, version-check]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable/backend.yml
    secrets: inherit
