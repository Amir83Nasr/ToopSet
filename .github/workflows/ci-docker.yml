name: CI — Docker

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "compose.yml"
      - "scripts/**"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "compose.yml"
      - "scripts/**"
      - ".github/workflows/ci-docker.yml"

jobs:
  scan-backend:
    name: Scan backend (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on backend Dockerfile
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "config"
          scan-ref: "backend/Dockerfile"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend-results.sarif"

  scan-frontend:
    name: Scan frontend (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on frontend Dockerfile
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "config"
          scan-ref: "frontend/Dockerfile"
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-frontend-results.sarif"

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: toopset-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "image"
          scan-ref: "toopset-backend:ci"
          format: "sarif"
          output: "trivy-backend-image-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend-image-results.sarif"

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: toopset-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "image"
          scan-ref: "toopset-frontend:ci"
          format: "sarif"
          output: "trivy-frontend-image-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-frontend-image-results.sarif"
