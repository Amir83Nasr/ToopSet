# ── ToopSet — Backend CI ────────────────────────────────────────────────────
# Self-contained pipeline for backend changes. Path-gated natively on the
# trigger so backend-only PRs never burn frontend minutes and vice versa.
#
# lint runs static checks (Ruff, mypy, migration revisions) with no DB.
# test runs migrations against a fresh Postgres 17 (validates the alembic
# chain) and then the suite against the migrated schema, with Redis 7.
# ──────────────────────────────────────────────────────────────────────────────

name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# Cancel redundant runs for the same PR/ref (new commits kill in-progress runs).
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Postgres service credentials (shared by migration + test steps)
  POSTGRES_DB: toopset_test
  POSTGRES_USER: toopset
  POSTGRES_PASSWORD: toopset_secret
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (Ruff + mypy + revisions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # VERSION gate runs before install — only needs stdlib python3.
      - name: Version check
        working-directory: .
        run: make version-check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      # Static-only — never touches a DB.
      - name: Migration revision check (no DB)
        run: python3 -m scripts.check_revisions --strict

  test:
    name: Test (migrations + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: toopset_test
          POSTGRES_USER: toopset
          POSTGRES_PASSWORD: toopset_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Migration validity gate: fresh Postgres, apply the full alembic chain.
      # conftest then runs create_all (no-op) so tests exercise the migrated
      # schema, not just the ORM models.
      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://toopset:toopset_secret@localhost:5432/toopset_test

      - name: Test (pytest)
        run: python3 -m pytest tests/ -v --tb=short -W ignore::DeprecationWarning
        env:
          DATABASE_URL: postgresql+asyncpg://toopset:toopset_secret@localhost:5432/toopset_test
