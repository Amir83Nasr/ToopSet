# ── ToopSet — Frontend CI ───────────────────────────────────────────────────
# Self-contained pipeline for frontend changes. The workflow ALWAYS runs for
# PRs to main and pushes to main; path-gating happens at the JOB level
# (dorny/paths-filter) so backend-only PRs get a deterministic "Success" for
# the three required checks instead of a path-skipped run that leaves them
# "Expected — waiting for status to be reported" forever.
#
# Three jobs run in parallel so a lint failure never blocks the build/test
# results and each stage can be re-run independently from the Actions UI.
# pnpm store caching is handled natively by actions/setup-node (cache: pnpm);
# pnpm itself is installed first by pnpm/action-setup.
# ──────────────────────────────────────────────────────────────────────────────

name: Frontend CI

# IMPORTANT: Do NOT add `paths:` to the `on:` triggers. This workflow must run
# for every PR to main so its required checks always report a conclusion.
# Path-gating must happen at the JOB level (`if: ${{ dorny/paths-filter }}`),
# otherwise a path-filtered run is skipped entirely and required checks
# permanently show "Expected — waiting for status to be reported".
# Skipped jobs report as "Success" and never block a PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel redundant runs for the same PR/ref (new commits kill in-progress runs).
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: frontend

jobs:
  # Always runs. Required lint/test/build jobs stay "Success" when skipped (no
  # frontend files changed) instead of leaving branch-protection checks hanging.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/frontend-ci.yml'

  lint:
    name: Lint (ESLint + TypeScript)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/action-setup must run before setup-node so the pnpm binary
      # exists when setup-node primes its cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Monorepo: packageManager pin lives in frontend/package.json,
          # not the repo root (default lookup), so point the action at it.
          package_json_file: frontend/package.json

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

  test:
    name: Test (Vitest)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Vitest)
        run: pnpm test

  build:
    name: Build (Next.js)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse Next.js build cache across runs. Lockfile change busts it.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build (Next.js)
        run: pnpm build
