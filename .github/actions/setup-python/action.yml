name: "Setup Python"
description: "Set up Python 3.12 and install backend dependencies"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      shell: bash
      run: pip install -r backend/requirements.txt

    - name: Install test dependencies
      shell: bash
      run: pip install pytest pytest-asyncio httpx pytest-httpx asgi-lifespan pytest-cov
