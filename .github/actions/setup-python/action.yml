name: "Setup Python"
description: "Check out repo, set up Python 3.12, and install backend dependencies"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      shell: bash
      run: pip install -r backend/requirements.txt
