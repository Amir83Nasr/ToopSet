name: "Setup Node.js"
description: "Set up Node.js 20 and install frontend dependencies"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node.js dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
