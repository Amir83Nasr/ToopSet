# ── ToopSet — Lefthook Hooks ──────────────────────────────────────────────────
# Pre-commit: fast, staged-only — format and catch obvious mistakes.
# Pre-push:   read-only, repo-wide — typecheck, lint, test, build, backend checks.
# Backend tests need Postgres + Redis — left to CI, not local hooks.
# CI is the authoritative full pipeline.
# ──────────────────────────────────────────────────────────────────────────────
# Docs: https://github.com/evilmartians/lefthook

# Hide the hook header and each command's invocation line; keep results.
output:
  - meta
  - execution

pre-commit:
  # Fixers (ruff, prettier, eslint) rewrite and restage files, so keep them
  # serial to avoid racing on the same files.
  parallel: false
  commands:
    # ── Safety ────────────────────────────────────────────────────────────────
    merge-conflict:
      glob: "*"
      run: |
        conflicts=$(grep -El '^<<<<<<< |^=======$|^>>>>>>> ' {staged_files} 2>/dev/null || true)
        if [ -n "$conflicts" ]; then
          echo "✗ Merge conflict markers in: $conflicts"
          exit 1
        fi

    detect-private-key:
      glob: "*"
      run: |
        keys=$(grep -El 'BEGIN[[:space:]]+(RSA|DSA|EC|OPENSSH)[[:space:]]+PRIVATE[[:space:]]+KEY' {staged_files} 2>/dev/null || true)
        if [ -n "$keys" ]; then
          echo "✗ Private key detected in: $keys"
          exit 1
        fi

    # ── Backend — staged Python only, fixes restaged ─────────────────────────
    # NB: lefthook's "**/" doesn't match files at the glob root (backend/*.py),
    # so the brace OR is required to cover both top-level and nested modules.
    ruff-format:
      glob: "{backend/*.py,backend/**/*.py}"
      run: ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "{backend/*.py,backend/**/*.py}"
      run: ruff check --fix {staged_files}
      stage_fixed: true

    # ── Frontend — staged files only, fixes restaged ─────────────────────────
    # pnpm exec from frontend/, so strip the root-relative prefix.
    # NB: lefthook's "**/" doesn't match files at the glob root (frontend/foo.tsx),
    # so the brace OR is required to cover both top-level and nested files.
    prettier:
      glob: "{frontend/*.{js,ts,jsx,tsx,css,json,md,mjs,mts},frontend/**/*.{js,ts,jsx,tsx,css,json,md,mjs,mts}}"
      run: cd frontend && pnpm exec prettier --write --ignore-unknown $(printf '%s\n' {staged_files} | sed 's|^frontend/||')
      stage_fixed: true

    eslint:
      glob: "{frontend/*.{ts,tsx,js,jsx},frontend/**/*.{ts,tsx,js,jsx}}"
      run: cd frontend && pnpm exec eslint --fix $(printf '%s\n' {staged_files} | sed 's|^frontend/||')
      stage_fixed: true

pre-push:
  # All checks are read-only and independent — parallel keeps push fast.
  # Backend commands are gated on backend files so frontend-only pushes skip them.
  parallel: true
  commands:
    # ── Frontend ──────────────────────────────────────────────────────────────
    # typecheck omitted: next build rewrites .next/types, so a separate parallel
    # tsc would race it (TS6053 on .next/types/**). Build already type-checks.
    lint:
      run: cd frontend && pnpm lint

    test:
      run: cd frontend && pnpm test

    build:
      run: cd frontend && pnpm build

    # ── Backend ───────────────────────────────────────────────────────────────
    ruff-check:
      glob: "{backend/*.py,backend/**/*.py}"
      run: cd backend && ruff check .

    ruff-format:
      glob: "{backend/*.py,backend/**/*.py}"
      run: cd backend && ruff format --check .

    mypy:
      glob: "{backend/*.py,backend/**/*.py}"
      run: cd backend && mypy app

    # ── Migrations — static, no DB ────────────────────────────────────────────
    migration-check:
      run: cd backend && python3 -m scripts.check_revisions --strict
