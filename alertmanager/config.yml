route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "default"
      repeat_interval: 1h

receivers:
  - name: "default"
    # Currently logs to stdout — extend with email/Slack/Telegram later
    # via the webhook or slack_configs / email_configs blocks.
    # Example for Telegram (requires alertmanager-bot sidecar):
    #   - name: "telegram"
    #     webhook_configs:
    #       - url: "http://alertmanager-bot:8080"
